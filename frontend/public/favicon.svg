<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three bars for three bets, in the rate-class ladder colours. Sibling to
       the Underwriting Copilot mark, which uses the same motif for carriers. -->
  <rect width="32" height="32" rx="7" fill="#0b1220" />
  <rect x="7" y="8"  width="18" height="3.5" rx="1.75" fill="#34d399" />
  <rect x="7" y="14" width="13" height="3.5" rx="1.75" fill="#56b6f0" />
  <rect x="7" y="20" width="15" height="3.5" rx="1.75" fill="#fbbf24" />
</svg>
