<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Onboarding Copilot — where the days actually go</title>
    <meta
      name="description"
      content="Measuring whether AI-assisted document reading makes agent onboarding faster. Someone actively working is 0.3% of a 15-day onboarding; extraction removes 0.1% against a threshold registered before the build. Illustrative demonstration; all data is fictional."
    />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Applies a stored colour scheme before first paint, so a dark-themed
      // machine never sees a white flash. Kept inline and tiny; it is the only
      // script that blocks rendering.
      try {
        var s = localStorage.getItem('uc-color-scheme');
        if (s === 'light' || s === 'dark') {
          document.documentElement.setAttribute('data-theme', s);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
